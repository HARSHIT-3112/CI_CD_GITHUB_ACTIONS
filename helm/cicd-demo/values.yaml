# Default values for the cicd-demo chart. Every knob lives here; override any of
# them at deploy time with `--set key=value` or `-f my-values.yaml`.

replicaCount: 2

image:
  repository: cicd-demo
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------- #
# Blue-green deployment (Part 6)
# ---------------------------------------------------------------------------- #
# Two independent "color" tracks can run at once. The main Service routes 100%
# of traffic to `activeColor`; a separate preview Service routes to
# `previewColor` so you can test the idle color BEFORE cutting over. Cutover is
# just flipping `activeColor` (an atomic Service-selector change).
activeColor: blue
previewColor: green

colors:
  blue:
    enabled: true
    tag: "1.0.3"
  green:
    enabled: false
    tag: "1.0.4"

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

# The pod's identity. Vault authorizes secret access by ServiceAccount, so the
# app needs a dedicated one (not the namespace 'default').
serviceAccount:
  create: true
  name: ""        # defaults to the fullname (cicd-demo)

# Vault secret injection (Part 8). When enabled, the Vault Agent Injector adds an
# init container that authenticates with the pod's ServiceAccount, reads the
# secret, and writes it to /vault/secrets/greeting — which the app reads via
# GREETING_FILE. The secret value never appears in git, the image, or a ConfigMap.
vault:
  enabled: false
  role: cicd-demo
  secretPath: secret/data/cicd-demo   # kv-v2 path
  secretKey: greeting

# Non-secret configuration, injected as environment variables (12-factor).
# NOTE: GREETING is here only as the NON-secret fallback for local/dev. When
# vault.enabled=true, the real greeting comes from Vault and overrides this.
config:
  APP_ENV: "helm"
  LOG_LEVEL: "INFO"
  GREETING: "Hello from Helm"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5
  failureThreshold: 3
