# The MAIN service: routes 100% of production traffic to the ACTIVE color only.
# Cutover = change .Values.activeColor and `helm upgrade` — this selector flips
# atomically and traffic moves instantly, with no pod restarts.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cicd-demo.fullname" . }}
  labels:
    {{- include "cicd-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "cicd-demo.selectorLabels" . | nindent 4 }}
    color: {{ .Values.activeColor }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
