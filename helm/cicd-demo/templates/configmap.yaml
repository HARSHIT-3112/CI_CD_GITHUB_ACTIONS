apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cicd-demo.fullname" . }}-config
  labels:
    {{- include "cicd-demo.labels" . | nindent 4 }}
data:
  # Render every key under .Values.config as a ConfigMap entry.
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
