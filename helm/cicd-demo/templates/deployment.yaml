{{/*
Render ONE Deployment per enabled color (blue / green). Each track is a complete,
independent set of pods, labelled with `color: <blue|green>`. The Service selects
which color actually receives traffic — so both can run at once and cutover is a
selector flip, never a pod restart.

`$` is the root context (needed because `range` rebinds `.`).
*/}}
{{- range $color, $spec := .Values.colors }}
{{- if $spec.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cicd-demo.fullname" $ }}-{{ $color }}
  labels:
    {{- include "cicd-demo.labels" $ | nindent 4 }}
    color: {{ $color }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cicd-demo.selectorLabels" $ | nindent 6 }}
      color: {{ $color }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- if $.Values.vault.enabled }}
        # These annotations tell the Vault Agent Injector to add an init container
        # that authenticates as this pod's ServiceAccount, reads the secret, and
        # renders it to /vault/secrets/greeting for the app to read.
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-status: "update"
        vault.hashicorp.com/role: {{ $.Values.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-greeting: {{ $.Values.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-greeting: {{ printf `{{- with secret "%s" -}}{{ .Data.data.%s }}{{- end -}}` $.Values.vault.secretPath $.Values.vault.secretKey | quote }}
        {{- end }}
      labels:
        {{- include "cicd-demo.selectorLabels" $ | nindent 8 }}
        color: {{ $color }}
    spec:
      serviceAccountName: {{ include "cicd-demo.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $.Chart.Name }}
          image: "{{ $.Values.image.repository }}:{{ $spec.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          # The app surfaces this in its responses, so a cutover is visible.
          env:
            - name: COLOR
              value: {{ $color | quote }}
            {{- if $.Values.vault.enabled }}
            # Tell the app to read its greeting (the secret) from the file the
            # Vault agent injects, instead of the plain ConfigMap env var.
            - name: GREETING_FILE
              value: /vault/secrets/greeting
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "cicd-demo.fullname" $ }}-config
          livenessProbe:
            {{- toYaml $.Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml $.Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
{{- end }}
