# CI/CD pipeline: lint + test, then build + security-scan + publish the image,
# then deploy it to a throwaway Kubernetes cluster and smoke-test it.
#
# Flow:
#   push / PR ─► test ─► build-scan-push ─► deploy (main only)
#
# The image is published to GitHub Container Registry (GHCR) using the built-in
# GITHUB_TOKEN — no external registry account or long-lived secret required.

name: CI/CD

# When does this run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR when a newer commit arrives —
# saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read the code, and write packages (needed to push to
# GHCR). Nothing else.
permissions:
  contents: read
  packages: write

env:
  # Image name on GHCR. metadata-action lowercases this, which GHCR requires.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cicd-demo

jobs:
  # --------------------------------------------------------------------------- #
  # Job 1: lint + unit tests. This is the fail-fast gate — if it fails, the
  # build job (which "needs" this one) never runs.
  # --------------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                   # cache pip downloads
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run tests (pytest)
        run: pytest app/tests/ -v

  # --------------------------------------------------------------------------- #
  # Job 2: build the image, scan it, and (only on main) push it to GHCR.
  # --------------------------------------------------------------------------- #
  build-scan-push:
    runs-on: ubuntu-latest
    needs: test                                        # gate: only if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Container registry names must be lowercase, but the repo owner can
      # contain uppercase. GitHub expressions have no lowercase() function, so
      # we compute it in shell and override IMAGE_NAME for the rest of the job.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cicd-demo" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compute image tags + labels from git metadata (a sha tag always; a
      # 'latest' tag only on the main branch).
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image and LOAD it into the local Docker so the scanner can see
      # it. push:false here — we only publish after the scan passes (below).
      # GitHub Actions cache (gha) makes repeat builds fast.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Install the Trivy CLI directly (the official install script). We run the
      # CLI rather than the wrapper action to avoid a broken transitive pin in
      # some trivy-action releases, and to keep the command identical to what we
      # run locally.
      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.72.0
          trivy --version

      # Security gate. --ignore-unfixed drops CVEs with no available fix (the
      # unpatchable base-image noise); the build FAILS on any FIXABLE
      # HIGH/CRITICAL. --exit-code 1 is what turns a finding into a failed job.
      - name: Scan image (Trivy) — fail on fixable HIGH/CRITICAL
        run: |
          trivy image \
            --scanners vuln \
            --ignore-unfixed \
            --severity HIGH,CRITICAL \
            --pkg-types os,library \
            --exit-code 1 \
            --no-progress \
            "${IMAGE_NAME}:sha-${{ github.sha }}"

      # Only authenticate + publish on a real push to main — never for PRs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------------------------- #
  # Job 3 (CD): deploy the just-published image to a THROWAWAY kind cluster and
  # smoke-test it. This proves the artifact actually deploys and serves — a real
  # deployment gate — with no cloud account or secrets.
  #
  # For a REAL environment, you would instead point kubectl/helm at a persistent
  # cluster: replace the "Create kind cluster" step with a step that writes a
  # kubeconfig from a secret (e.g. ${{ secrets.KUBECONFIG }}) and drop the
  # kind-load step (the cluster pulls from GHCR directly with an imagePullSecret).
  # --------------------------------------------------------------------------- #
  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cicd-demo" >> "$GITHUB_ENV"

      # Spin up an ephemeral single-node Kubernetes cluster on the runner.
      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Pull the image we just published, and load it into the kind cluster so no
      # imagePullSecret is needed for this throwaway environment.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image into kind
        run: |
          docker pull "${IMAGE_NAME}:sha-${{ github.sha }}"
          kind load docker-image "${IMAGE_NAME}:sha-${{ github.sha }}" --name chart-testing

      # Deploy with the SAME Helm chart used everywhere else, pointed at the GHCR
      # image tag for this commit. Vault is off here (no Vault in this ephemeral
      # cluster); the greeting falls back to the ConfigMap value.
      - name: Deploy with Helm
        run: |
          helm upgrade --install cicd-demo ./helm/cicd-demo \
            --namespace cicd-demo --create-namespace \
            --set image.repository="${IMAGE_NAME}" \
            --set colors.blue.tag="sha-${{ github.sha }}" \
            --set colors.green.enabled=false \
            --set vault.enabled=false \
            --wait --timeout 120s
          kubectl -n cicd-demo get pods,svc

      # Smoke test: hit the live Service and assert a healthy, well-formed response.
      - name: Smoke test the deployment
        run: |
          kubectl -n cicd-demo port-forward svc/cicd-demo 8080:80 &
          PF_PID=$!
          sleep 5
          echo "--- /health/ready ---"
          curl -fsS localhost:8080/health/ready
          echo; echo "--- / ---"
          curl -fsS localhost:8080/ | tee /tmp/resp.json
          echo
          # Fail the job if the response is missing the expected field.
          grep -q '"served_by"' /tmp/resp.json
          kill $PF_PID 2>/dev/null || true
          echo "✅ deployment smoke test passed"
