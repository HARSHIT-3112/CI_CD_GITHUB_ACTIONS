# CI pipeline: lint + test, then build + security-scan + publish the image.
#
# Flow:
#   push / PR ─► test ─► build-scan-push (only pushes the image on main)
#
# The image is published to GitHub Container Registry (GHCR) using the built-in
# GITHUB_TOKEN — no external registry account or long-lived secret required.

name: CI

# When does this run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run for the same branch/PR when a newer commit arrives —
# saves CI minutes and gives faster feedback.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege token: read the code, and write packages (needed to push to
# GHCR). Nothing else.
permissions:
  contents: read
  packages: write

env:
  # Image name on GHCR. metadata-action lowercases this, which GHCR requires.
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cicd-demo

jobs:
  # --------------------------------------------------------------------------- #
  # Job 1: lint + unit tests. This is the fail-fast gate — if it fails, the
  # build job (which "needs" this one) never runs.
  # --------------------------------------------------------------------------- #
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip                                   # cache pip downloads
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app/

      - name: Run tests (pytest)
        run: pytest app/tests/ -v

  # --------------------------------------------------------------------------- #
  # Job 2: build the image, scan it, and (only on main) push it to GHCR.
  # --------------------------------------------------------------------------- #
  build-scan-push:
    runs-on: ubuntu-latest
    needs: test                                        # gate: only if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compute image tags + labels from git metadata (a sha tag always; a
      # 'latest' tag only on the main branch).
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Build the image and LOAD it into the local Docker so the scanner can see
      # it. push:false here — we only publish after the scan passes (below).
      # GitHub Actions cache (gha) makes repeat builds fast.
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Security gate. --ignore-unfixed drops CVEs with no available fix (the
      # unpatchable base-image noise); the build FAILS on any FIXABLE
      # HIGH/CRITICAL. exit-code 1 is what turns a finding into a failed job.
      - name: Scan image (Trivy) — fail on fixable HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Only authenticate + publish on a real push to main — never for PRs.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
